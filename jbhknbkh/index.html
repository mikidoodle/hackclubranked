<!doctype html>
<html><head><script>
window.__RANKED_PREVIEW__ = false;
function __rankedNormalizePage(page) {
  return String(page).split("#")[0].split("?")[0].replace(/^\.\//, "").replace(/^\/+/, "");
}
window.goTo = function goTo(page) {
  if (window.__RANKED_PREVIEW__) {
    window.parent.postMessage({ source: "ranked-preview", type: "navigate", page: __rankedNormalizePage(page) }, "*");
  } else {
    window.location.href = page;
  }
};</script><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="https://cdn.tailwindcss.com"></script><style>body { margin: 0; font-family: ui-monospace, Menlo, monospace; background: #f8eeff; color: #20201f; }

h1 { font-size: 32px; margin: 0; }</style></head>
